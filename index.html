<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拾页 · PDF 原文件解析</title><meta name="author" content="泽涵"><style>
:root{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;color:#192f2b;background:#f5f7f3}*{box-sizing:border-box}body{margin:0}header{max-width:1120px;margin:auto;padding:30px 28px;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:10px;font-weight:750;font-size:22px}.mark{background:#164f42;color:white;border-radius:10px;padding:7px 11px}.tag{font-size:12px;color:#61766d;border:1px solid #d7e0d9;border-radius:20px;padding:7px 12px}main{max-width:900px;margin:65px auto 0;padding:0 24px}.eyebrow{letter-spacing:3px;font-size:12px;color:#39816b;font-weight:700}h1{font-size:clamp(34px,6vw,54px);letter-spacing:-2px;margin:18px 0;line-height:1.3}h1 span{color:#38836b}.intro{color:#6d7e76;font-size:16px;line-height:1.9;margin-bottom:35px}.card{padding:30px;background:white;border:1px solid #dce4dc;border-radius:18px;box-shadow:0 18px 50px #254f3810}label{display:block;font-weight:600;font-size:14px;margin-bottom:13px}textarea{resize:vertical;min-height:115px;max-height:230px;border:1px solid #d4ddd5;border-radius:10px;width:100%;padding:16px;font:14px/1.7 inherit;background:#fafcf9;color:#294539;outline:none}textarea:focus{border-color:#38836b;box-shadow:0 0 0 3px #38836b15}.row{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-top:18px}button,.button{font:inherit;font-size:14px;cursor:pointer;border:0;border-radius:9px;padding:13px 21px;background:#1b5949;color:white;text-decoration:none;display:inline-block;font-weight:600}button:hover,.button:hover{background:#28765e}button:disabled{opacity:.6;cursor:wait}.quiet{background:transparent;color:#64786d;padding:8px 0;font-weight:400}.quiet:hover{background:transparent;color:#1b5949}.hint{color:#829087;font-size:12px;line-height:1.8;margin:20px 0 0}.result{margin-top:18px;padding:24px;background:#f0f7f1;border:1px solid #c9dfcf;border-radius:12px;overflow-wrap:anywhere}.result h2{font-size:17px;margin:0 0 14px}.result p{font-size:13px;color:#5b7666;line-height:1.8}.file{font-weight:650}.links{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.secondary{background:white;color:#255742;border:1px solid #cad9cd}.error{background:#fff5ef;border-color:#f0d3bc}.error p{color:#925733}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin:38px 0 60px}.step{font-size:13px;color:#738277;line-height:1.8}.step b{display:block;color:#3d5749;font-size:14px;margin-bottom:7px}.num{font-family:monospace;color:#9aac9f;margin-right:8px}footer{max-width:1120px;border-top:1px solid #dce4dc;margin:60px auto 0;padding:23px 28px;font-size:12px;color:#89958b;display:flex;justify-content:space-between;gap:16px}a{color:#276c54}#status{font-size:13px;color:#47715b;margin:18px 0 0}[hidden]{display:none!important}@media(max-width:600px){header{padding:22px}main{margin-top:38px}.card{padding:20px}.steps{grid-template-columns:1fr;gap:18px}.row{align-items:flex-start;flex-direction:column}.row button[type=submit]{width:100%}footer{flex-direction:column}h1{letter-spacing:-1px}}
</style></head><body><header><div class="brand"><span class="mark">↳</span>拾页 <span style="font-size:12px;font-weight:400;color:#829087;margin-left:8px">PDF LINK</span></div><span class="tag">网页 PDF 解析工具</span></header><main><div class="eyebrow">从预览，到原文件</div><h1>粘贴一个链接，<br>找回 <span>PDF 原文件。</span></h1><p class="intro">读取网页链接，查找并验证原始 PDF。<br>保留文件本来的清晰度，让阅读和保存更简单。</p><section class="card"><form id="form"><label for="url">文档预览链接</label><textarea id="url" name="url" required placeholder="在这里粘贴网页或 PDF 链接 https://…" spellcheck="false"></textarea><div class="row"><button type="button" class="quiet" id="example">试试你提供的示例 ↗</button><button type="submit" id="submit">解析原始 PDF <span aria-hidden="true">→</span></button></div><p class="hint">支持普通网页、内嵌 PDF、PDF.js 预览和超星链接。下载前会校验 PDF 文件标识；不会将预览图片拼接为文档。</p></form><p id="status" role="status" aria-live="polite" hidden></p><section class="result" id="result" aria-live="polite" hidden></section></section><div class="steps"><div class="step"><b><span class="num">01</span>复制链接</b>打开文档预览页，复制完整网址。</div><div class="step"><b><span class="num">02</span>解析并验证</b>查找文件地址，确认返回的是 PDF。</div><div class="step"><b><span class="num">03</span>保存原文件</b>下载 PDF，或复制原始文件地址。</div></div></main><footer><span>拾页 · 让文档回到文档 · 作者：泽涵</span><span>请仅下载你有权访问的文件。需登录的文档请在原站操作。</span></footer><script>
const $=id=>document.getElementById(id);const sample='https://previewyd.chaoxing.com/res/view/view.html?objectid=6f14ff3640a48e4c3c38e6b35404d2d9&fileName='+encodeURIComponent('带封面-未压缩-成果总结报告202607078（上报版）')+'&download=false&pageNum=1';$('example').onclick=()=>{$('url').value=sample;$('url').focus()};
function node(tag,text,cls){const n=document.createElement(tag);n.textContent=text;if(cls)n.className=cls;return n}
$('form').onsubmit=async e=>{e.preventDefault();const result=$('result');result.hidden=true;result.replaceChildren();$('submit').disabled=true;$('submit').textContent='正在解析…';$('status').hidden=false;$('status').textContent='正在读取预览页并验证文件，通常需要几秒，最长约一分钟。';try{const response=await fetch('/api/resolve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:$('url').value.trim()}),signal:AbortSignal.timeout(70000)});const data=await response.json();if(!response.ok)throw Error(data.error||'解析失败');result.className='result';result.append(node('h2','✓ 已验证原始 PDF'),node('div',data.name,'file'),node('p',data.bytes?'文件大小：'+(data.bytes/1024/1024).toFixed(2)+' MB · 源地址可能随源站规则失效':'源站未提供文件大小 · 源地址可能随源站规则失效'));const links=node('div','','links');const download=node('a','下载 PDF ↓','button');download.href=data.download;links.append(download);const open=node('a','打开原始文件 ↗','button secondary');open.href=data.url;open.target='_blank';open.rel='noopener noreferrer';links.append(open);const copy=node('button','复制原始地址','button secondary');copy.onclick=async()=>{try{await navigator.clipboard.writeText(data.url);copy.textContent='已复制'}catch{copy.textContent='请从下方选择复制'}};links.append(copy);result.append(links,node('p',data.url));}catch(err){result.className='result error';result.append(node('h2','暂时未能解析'),node('p',err.name==='TimeoutError'?'解析超时，请稍后重试或检查源站网络。':err.message));}finally{result.hidden=false;$('status').hidden=true;$('submit').disabled=false;$('submit').textContent='解析原始 PDF →'}};
</script></body></html>
